name: Полный декомпил в ветку (source/)

# Ручной запуск. Качает APK с зеркала, декомпилирует ВЕСЬ (apktool + jadx)
# и коммитит полные деревья в папку source/ этой ветки.
# Ничего не собирает, ничего не тестирует.

on:
  workflow_dispatch: {}
  push:
    branches: [arena/01a08582-meowmdmdmmdd]
    paths:
      - .github/workflows/decompile.yml
      - .decompile-trigger

permissions:
  contents: write

env:
  APKPURE_URL: "https://d.apkpure.net/b/APK/org.telegram.mdgram?versionCode=30275&nc=arm64-v8a%2Carmeabi-v7a%2Cx86%2Cx86_64&sv=21"
  APKPURE_SHA1: "4fa5ae96754b910045d1d84dac7a8261c59793e9"

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout ветки
        uses: actions/checkout@v4
        with:
          ref: arena/01a08582-meowmdmdmmdd

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: APK + apktool decode (весь)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p work && cd work
          curl -sL --retry 3 -A "Mozilla/5.0" -o MDGram-9.3.3.apk "$APKPURE_URL"
          echo "$APKPURE_SHA1  MDGram-9.3.3.apk" | sha1sum -c -
          APKTOOL_TAG=$(gh release view --repo iBotPeaches/Apktool --json tagName --jq .tagName 2>/dev/null || echo v2.9.3)
          echo "apktool tag: $APKTOOL_TAG"
          curl -sL --retry 3 -o apktool.jar "https://github.com/iBotPeaches/Apktool/releases/download/${APKTOOL_TAG}/apktool_${APKTOOL_TAG#v}.jar" || true
          if ! java -jar apktool.jar --version 2>/dev/null; then
            echo "fallback на v2.9.3"
            curl -sL --retry 3 -o apktool.jar "https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar"
          fi
          java -jar apktool.jar --version
          java -jar apktool.jar d -f -o apktool_out MDGram-9.3.3.apk
          echo "smali: $(find apktool_out -name '*.smali' | wc -l)"

      - name: jadx (все java-исходники)
        run: |
          set -e
          cd work
          curl -sL --retry 3 -o jadx.zip "https://github.com/skylot/jadx/releases/download/v1.4.7/jadx-1.4.7.zip"
          rm -rf jadx && mkdir jadx
          unzip -q -o jadx.zip -d jadx
          ./jadx/bin/jadx -d jadx_out --no-res --threads-count 4 MDGram-9.3.3.apk 2>&1 | tail -3 || true
          test -d jadx_out/sources
          echo "java: $(find jadx_out/sources -name '*.java' | wc -l)"

      - name: Папка source/ + коммит в ветку
        run: |
          set -e
          rm -rf source
          mkdir -p source
          mv work/apktool_out source/apktool
          if [ -d work/jadx_out/sources ]; then
            mv work/jadx_out/sources source/jadx
          else
            mv work/jadx_out source/jadx
          fi
          SMALI=$(find source/apktool -name '*.smali' | wc -l)
          JAVA=$(find source/jadx -name '*.java' | wc -l)
          SIZE=$(du -sh source | cut -f1)
          echo "Итого: smali=$SMALI java=$JAVA size=$SIZE"
          cat > source/README.md <<EOF
          # MDGram 9.3.3 — полный декомпил (оригинал с APKPure, без модов)
          - APK: 9.3.3 (30275), SHA1 сверен
          - smali файлов: $SMALI
          - java файлов: $JAVA
          - размер папки: $SIZE
          ## Структура
          - \`source/apktool/\` — полный вывод apktool (smali + ресурсы + манифест). ЭТО собирается обратно в APK.
          - \`source/jadx/\` — java-исходники для чтения и контроля (не собираются напрямую).
          EOF
          git config user.name "arena-decompile-bot"
          git config user.email "arena-decompile-bot@users.noreply.github.com"
          git pull --rebase origin arena/01a08582-meowmdmdmmdd || true
          git add source
          git commit -m "Полный декомпил MDGram 9.3.3: smali=$SMALI java=$JAVA ($SIZE)"
          git push origin HEAD:arena/01a08582-meowmdmdmmdd
