name: "Декомпиляция MDGram 9.3.3 (APK со стороннего зеркала, НЕ GitHub)"

on:
  workflow_dispatch:
    inputs:
      apk_source:
        description: "Откуда качать APK"
        type: choice
        options: [apkpure, aptoide]
        default: apkpure
  push:
    branches: [arena/01a08582-meowmdmdmmdd]
    paths:
      - .github/workflows/decompile.yml
      - .decompile-trigger

permissions:
  contents: write

env:
  # APKPure, MDGram Messenger 9.3.3 (versionCode 30275), universal APK 75.6 MB, 28.01.2023
  APKPURE_URL: "https://d.apkpure.net/b/APK/org.telegram.mdgram?versionCode=30275&nc=arm64-v8a%2Carmeabi-v7a%2Cx86%2Cx86_64&sv=21"
  APKPURE_SHA1: "4fa5ae96754b910045d1d84dac7a8261c59793e9"
  # Aptoide fallback, MDGram 9.3.3 (vercode 30275)
  APTOIDE_URL: "https://url-provider.aptoide."
  APTOIDE_MD5: "fbc8dccadb0529bcfd8d3a73e7b5a7fb"

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout ветки
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Скачивание APK (APKPure / Aptoide — НЕ GitHub)
        run: |
          set -e
          mkdir -p work && cd work
          SRC="${{ inputs.apk_source }}"
          [ -z "$SRC" ] && SRC="apkpure"
          echo "Источник: $SRC"
          echo "APK_SRC=$SRC" >> "$GITHUB_ENV"
          if [ "$SRC" = "aptoide" ]; then
            curl -sL --retry 3 -A "Mozilla/5.0" -o MDGram-9.3.3.apk "$APTOIDE_URL"
            echo "$APTOIDE_MD5  MDGram-9.3.3.apk" | md5sum -c -
          else
            curl -sL --retry 3 -A "Mozilla/5.0" -o MDGram-9.3.3.apk "$APKPURE_URL"
            echo "$APKPURE_SHA1  MDGram-9.3.3.apk" | sha1sum -c -
          fi
          ls -la MDGram-9.3.3.apk
          file MDGram-9.3.3.apk
          unzip -l MDGram-9.3.3.apk | tail -3

      - name: Установка apktool + jadx
        run: |
          set -e
          cd work
          curl -sL --retry 3 -o apktool.jar "https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar"
          curl -sL --retry 3 -o jadx.zip "https://github.com/skylot/jadx/releases/download/v1.4.7/jadx-1.4.7.zip"
          unzip -q jadx.zip -d jadx
          java -jar apktool.jar --version
          ./jadx/bin/jadx --version

      - name: apktool — ресурсы, манифест, smali
        run: |
          set -e
          cd work
          java -jar apktool.jar d -f -o apktool_out MDGram-9.3.3.apk
          echo "--- apktool.yml ---"
          grep -E "versionCode|versionName" apktool_out/apktool.yml || true

      - name: jadx — Java-код
        run: |
          set -e
          cd work
          ./jadx/bin/jadx -d jadx_out --no-res --threads-count 4 MDGram-9.3.3.apk 2>&1 | tail -5 || true
          echo "Java-файлов: $(find jadx_out -name '*.java' | wc -l)"

      - name: Сбор выжимки в decompiled/
        run: |
          set -e
          cd work
          OUT=../decompiled
          rm -rf "$OUT"
          mkdir -p "$OUT/themes" "$OUT/java" "$OUT/smali-mdgram"
          {
            echo "# MDGram 9.3.3 — откуда взят APK"
            echo ""
            echo "- Источник: ${{ inputs.apk_source }} (стороннее зеркало, НЕ GitHub)"
            echo "- APKPure URL: \`$APKPURE_URL\`"
            echo "- Файл: MDGram-9.3.3.apk"
            echo "- Размер: $(stat -c%s MDGram-9.3.3.apk) байт"
            echo "- SHA1: $(sha1sum MDGram-9.3.3.apk | cut -d' ' -f1)"
            echo "- SHA256: $(sha256sum MDGram-9.3.3.apk | cut -d' ' -f1)"
            echo "- MD5: $(md5sum MDGram-9.3.3.apk | cut -d' ' -f1)"
            echo ""
            echo "## apktool.yml"
            grep -E "versionCode|versionName" apktool_out/apktool.yml || true
            echo ""
            echo "## Манифест"
            grep -oE 'package="[^"]+"' apktool_out/AndroidManifest.xml | head -1
            echo ""
            echo "## Статистика"
            echo "- Java-файлов (jadx): $(find jadx_out -name '*.java' | wc -l)"
            echo "- smali-файлов: $(find apktool_out -name '*.smali' | wc -l)"
            echo "- dex в APK: $(unzip -l MDGram-9.3.3.apk | grep -c 'classes.*\.dex')"
          } > "$OUT/APK_INFO.md"
          cat "$OUT/APK_INFO.md"
          # Манифест и строки
          cp apktool_out/AndroidManifest.xml "$OUT/"
          cp apktool_out/apktool.yml "$OUT/" || true
          [ -f apktool_out/res/values/strings.xml ] && cp apktool_out/res/values/strings.xml "$OUT/strings.xml" || true
          grep -ohE 'name="(md|MD|rc)[^"]*"' apktool_out/res/values*/strings.xml 2>/dev/null | sort -u > "$OUT/md-strings-keys.txt" || true
          # Темы .attheme
          find apktool_out/assets -name '*.attheme' -exec cp {} "$OUT/themes/" \; 2>/dev/null || true
          ls "$OUT/themes/" | tee "$OUT/themes-list.txt"
          # Шрифты
          find apktool_out/assets apktool_out/res -iname '*.ttf' -o -iname '*.otf' 2>/dev/null | sort > "$OUT/fonts-list.txt" || true
          # Фирменный Java-слой MDGram
          if [ -d jadx_out/sources/org/telegram/mdgram ]; then
            cp -r jadx_out/sources/org/telegram/mdgram "$OUT/java/org_telegram_mdgram"
          fi
          [ -f jadx_out/sources/org/telegram/messenger/ApplicationLoaderImpl.java ] && cp jadx_out/sources/org/telegram/messenger/ApplicationLoaderImpl.java "$OUT/java/" || true
          # smali MDGram-слоя (имена полей/методов как есть)
          SMALI_MD=$(find apktool_out/smali* -type d -path '*org/telegram/mdgram' | head -1)
          if [ -n "$SMALI_MD" ]; then cp -r "$SMALI_MD" "$OUT/smali-mdgram/org_telegram_mdgram"; fi
          # Флаги MDConfig: сначала smali (.field), потом java
          MD_SMALI=$(find apktool_out/smali* -path '*mdgram/MDsettings/MDConfig.smali' | head -1)
          if [ -n "$MD_SMALI" ]; then
            grep -oE '\.field public static [^ ]+:[^ ]+' "$MD_SMALI" | sort -u > "$OUT/mdconfig_flags.txt" || true
          fi
          MD_JAVA="$OUT/java/org_telegram_mdgram/MDsettings/MDConfig.java"
          if [ ! -s "$OUT/mdconfig_flags.txt" ] && [ -f "$MD_JAVA" ]; then
            grep -oE 'public static [A-Za-z0-9_<>\[\]]+ [A-Za-z0-9_]+' "$MD_JAVA" | sort -u > "$OUT/mdconfig_flags.txt" || true
          fi
          echo "Флагов MDConfig: $(wc -l < "$OUT/mdconfig_flags.txt" 2>/dev/null || echo 0)"
          echo "Тем: $(ls "$OUT/themes" | wc -l)"
          du -sh "$OUT"

      - name: Коммит результата в ветку
        run: |
          set -e
          git config user.name "arena-decompile-bot"
          git config user.email "arena-decompile-bot@users.noreply.github.com"
          git add decompiled
          if git diff --cached --quiet; then
            echo "Изменений нет — коммитить нечего"
          else
            git commit -m "Декомпиляция MDGram 9.3.3 (APK: $APK_SRC, $(date -u +%F))"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Архивы полного вывода
        if: always()
        run: |
          cd work
          [ -d jadx_out ] && zip -qr ../full-jadx.zip jadx_out || true
          [ -d apktool_out ] && zip -qr ../full-apktool.zip apktool_out || true
          ls -la ../*.zip || true

      - name: Артефакты (полный декомпил + APK)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mdgram-933-decompiled
          path: |
            full-jadx.zip
            full-apktool.zip
            work/MDGram-9.3.3.apk
          if-no-files-found: warn
          retention-days: 90

      - name: Релиз с APK в нашем репозитории
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd work
          if gh release view apk-9.3.3 >/dev/null 2>&1; then
            gh release upload apk-9.3.3 MDGram-9.3.3.apk --clobber
          else
            gh release create apk-9.3.3 MDGram-9.3.3.apk \
              --title "MDGram 9.3.3 APK (зеркало ${{ inputs.apk_source }})" \
              --notes "MDGram Messenger 9.3.3 (30275), скачан со стороннего зеркала (${{ inputs.apk_source }}), НЕ с GitHub. SHA1 сверен. Декомпиляция — в папке decompiled/ ветки и в артефактах выше."
          fi
