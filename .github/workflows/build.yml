name: Сборка APK (MDGram)

on:
  workflow_dispatch:
  push:
    paths:
      - '.build-trigger'
      - '.github/workflows/build.yml'
      - 'MDGram/**'
      - 'android/TMessagesProj/src/main/res/**'

permissions:
  contents: write

jobs:
  build:
    name: Сборка APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Код
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Android SDK (лицензии + диагностика)
        run: |
          set -e
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-не задан}"
          echo "ANDROID_HOME=${ANDROID_HOME:-не задан}"
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            SDK=/usr/local/lib/android/sdk
          fi
          echo "SDK=$SDK"
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDK"     >> $GITHUB_ENV
          ls "$SDK" || true
          # автоматически принимаем лицензии — тогда AGP сам докачивает
          # platform/build-tools, которые нужны проекту
          mkdir -p "$SDK/licenses"
          printf '24333f8a63b6825ea9c5514f83c2829b004d1fee\n' > "$SDK/licenses/android-sdk-license"
          printf '84831b9409646a918e30573bab4c9c91346d8abd\n' > "$SDK/licenses/android-sdk-preview-license"
          printf 'd975f751698a77b662f1254ddbeed3901e976f5a\n' > "$SDK/licenses/intel-android-extra-license"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Gradle wrapper
        run: |
          set -e
          cd MDGram
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "wrapper.jar нет в репозитории — генерируем"
            curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-7.6-bin.zip
            unzip -q -o /tmp/gradle.zip -d /opt
            /opt/gradle-7.6/bin/gradle wrapper --gradle-version 7.6 --distribution-type bin --no-daemon
            git add -f gradle/wrapper/gradle-wrapper.jar gradlew gradle/wrapper/gradle-wrapper.properties || true
            git -c user.name="arena-agent" -c user.email="agent@arena.ai" \
                commit -m "gradle-wrapper.jar для сборки в Actions" || true
            git push || true
          fi
          chmod +x gradlew
          ls -la gradle/wrapper/

      - name: Сборка APK
        id: gradle
        continue-on-error: true
        run: |
          set -o pipefail
          cd MDGram
          ./gradlew :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
          echo "=== хвост лога ===" 
          tail -60 /tmp/build.log

      - name: Логи в ветку
        if: always()
        run: |
          mkdir -p build-logs
          cp /tmp/build.log "build-logs/run-${GITHUB_RUN_NUMBER}-$(date +%H%M).log" 2>/dev/null || true
          tail -200 /tmp/build.log > "build-logs/tail-${GITHUB_RUN_NUMBER}.log" 2>/dev/null || true
          git config user.name  "arena-agent"
          git config user.email "agent@arena.ai"
          git add -f build-logs/ || true
          git commit -m "логи сборки ${GITHUB_RUN_NUMBER}" || true
          git pull --rebase || true
          git push || true

      - name: Архив исходников в handof
        if: success()
        run: |
          set -e
          mkdir -p handof
          N=0
          [ -f handof/VERSION ] && N=$(cat handof/VERSION | tr -d ' \n')
          NEXT=$((N+1))
          echo "собираем архив исходника v$NEXT"
          zip -9 -q -r "handof/MDGram-source-v${NEXT}.zip" \
              MDGram mod-keystore PROGRESS.md ИНСТРУКЦИЯ.md README.md PORT_PLAN.md \
              -x "*/.gradle/*" "*/build/*" "*/.git/*" || true
          echo "$NEXT" > handof/VERSION
          ls -la handof/
          git config user.name  "arena-agent"
          git config user.email "agent@arena.ai"
          git add -f handof/ || true
          git commit -m "исходник v${NEXT} (полный архив) в handof" || echo "нечего коммитить"
          git pull --rebase || true
          git push || true

      - name: APK в ветку и в handof (версия)
        if: success()
        run: |
          set -e
          N=$(cat handof/VERSION 2>/dev/null | tr -d ' \n')
          [ -z "$N" ] && N=1
          mkdir -p apk handof
          for f in MDGram/app/build/outputs/apk/release/*.apk; do
            cp "$f" "apk/MDGram-9.3.3.apk"
            cp "$f" "handof/MDGram-9.3.3-v${N}.apk"
          done
          ls -la apk/ handof/
          git config user.name  "arena-agent"
          git config user.email "agent@arena.ai"
          git add -f apk/ handof/ || true
          git commit -m "APK 9.3.3 v${N} в apk/ и handof/" || echo "нечего коммитить"
          git pull --rebase || true
          git push || true

      - name: APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mdgram-apk-${{ github.run_number }}
          path: MDGram/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

  emulator:
    name: Проверка APK в эмуляторе (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
      - name: Код
        uses: actions/checkout@v4

      - name: APK из сборки
        uses: actions/download-artifact@v4
        with:
          name: mdgram-apk-${{ github.run_number }}
          path: apk

      - name: Включаем KVM
        if: runner.os == 'Linux'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Прогон в эмуляторе (свой запуск AVD)
        id: emu
        continue-on-error: true
        run: |
          set +e
          mkdir -p out
          LOG=out/emu.log
          echo "=== ОС: $(uname -a) ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMAN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMAN" ] || SDKMAN="$(dirname $(find $ANDROID_HOME -name sdkmanager -type f 2>/dev/null | head -1))"
          echo "sdkmanager=$SDKMAN"
          {
            yes | "$SDKMAN" --licenses > /dev/null 2>&1
            "$SDKMAN" --install "platform-tools" "platforms;android-24" \
                                "emulator" "system-images;android-24;google_apis;x86_64" 2>&1 | tail -10
            echo "== создаём AVD =="
            export ANDROID_AVD_HOME="$HOME/.android/avd"
            mkdir -p "$ANDROID_AVD_HOME"
            echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
                -n mdtest -k "system-images;android-24;google_apis;x86_64" \
                -p "$ANDROID_AVD_HOME/mdtest.avd" --device "pixel_2" --force 2>&1 | tail -20
            echo "== список AVD =="
            "$ANDROID_HOME/emulator/emulator" -list-avds 2>&1 | tail -5
            ls -la "$ANDROID_AVD_HOME" 2>&1 | tail -10
          } 2>&1 | tee -a "$LOG"
          AVDNAME=$("$ANDROID_HOME/emulator/emulator" -list-avds 2>/dev/null | head -1)
          [ -z "$AVDNAME" ] && AVDNAME=mdtest
          echo "AVDNAME=$AVDNAME" | tee -a "$LOG"
          EXTRA=""
          [ "$(uname)" != "Darwin" ] && EXTRA="-no-accel"
          "$ANDROID_HOME/emulator/emulator" -avd "$AVDNAME" -no-window $EXTRA \
              -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none \
              -memory 2048 -partition-size 2048 -no-snapshot -wipe-data \
              > out/emulator.log 2>&1 &
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          timeout 300 adb wait-for-device || echo "устройство не появилось за 300 с"
          echo "adb devices: $(adb devices | tail -2)" | tee -a "$LOG"
          i=0
          while [ "$i" -lt 120 ]; do
            boot=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$boot" = "1" ] && break
            i=$((i+1)); sleep 5
          done
          boot=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
          echo "boot_completed=$boot (попыток $i)" | tee -a "$LOG"
          echo "== ждём сервис package ==" | tee -a "$LOG"
          j=0
          while [ "$j" -lt 90 ]; do
            out=$(adb shell cmd package list packages 2>&1 | head -2)
            echo "$out" | grep -q "Can't find service" || break
            j=$((j+1)); sleep 10
          done
          echo "сервис package готов (попыток $j), последний ответ: $out" | tee -a "$LOG"
          sleep 30
          echo "== окно после загрузки ==" | tee -a "$LOG"
          adb shell dumpsys window 2>/dev/null | grep -E "mCurrentFocus" | head -2 | tee -a "$LOG"
          APK=$(ls apk/*.apk | head -1)
          echo "== ставим $APK ==" | tee -a "$LOG"
          timeout 900 adb push "$APK" /data/local/tmp/md.apk 2>&1 | tee -a "$LOG"
          for try in 1 2 3 4; do
            echo "== попытка установки $try ==" | tee -a "$LOG"
            if timeout 900 adb shell pm install -r -t /data/local/tmp/md.apk 2>&1 | tee -a "$LOG" | grep -qi "success"; then
              echo "УСТАНОВЛЕНО (попытка $try)" | tee -a "$LOG"; break
            fi
            sleep 25
          done
          adb shell pm list packages 2>/dev/null | grep mdgram | tee -a "$LOG"
          echo "== запуск приложения ==" | tee -a "$LOG"
          adb logcat -c
          adb shell monkey -p org.telegram.mdgram -c android.intent.category.LAUNCHER 1 2>&1 | tee -a "$LOG"
          sleep 120
          echo "== процесс ==" | tee -a "$LOG"
          adb shell pidof org.telegram.mdgram 2>&1 | tee -a "$LOG" || echo "ПРОЦЕСС НЕ НАЙДЕН" | tee -a "$LOG"
          echo "== окно ==" | tee -a "$LOG"
          adb shell dumpsys window 2>/dev/null | grep -E "mCurrentFocus|mFocusedApp" | head -4 | tee -a "$LOG"
          echo "== пакеты mdgram ==" | tee -a "$LOG"
          adb shell pm list packages 2>/dev/null | grep mdgram | tee -a "$LOG"
          echo "== краши ==" | tee -a "$LOG"
          adb logcat -d 2>/dev/null | grep -iE "FATAL EXCEPTION|AndroidRuntime|force finishing" | head -30 | tee -a "$LOG" || echo "крашей нет" | tee -a "$LOG"
          echo "== хвост logcat ==" | tee -a "$LOG"
          adb logcat -d -t 120 2>/dev/null | tee -a "$LOG"
          adb exec-out screencap -p > out/screen.png 2>/dev/null || echo "скриншот не снят" | tee -a "$LOG"
          ls -la out | tee -a "$LOG"
          # сохраняем результат сразу отсюда, иначе логи пропадут
          mkdir -p emulator-logs
          cp out/* emulator-logs/ 2>/dev/null || true
          git config user.name  "arena-agent"
          git config user.email "agent@arena.ai"
          git add -f emulator-logs || true
          git commit -m "проверка APK в эмуляторе (${{ matrix.os }}): логи и скриншот (ран ${{ github.run_number }})" || echo "нечего коммитить"
          git pull --rebase || true
          git push || true
          sleep 3

      - name: Скриншот и логи
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-check-${{ matrix.os }}-${{ github.run_number }}
          path: out/
          if-no-files-found: warn
