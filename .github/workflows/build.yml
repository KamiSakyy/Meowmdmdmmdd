name: Сборка APK (MDGram)

on:
  workflow_dispatch:
  push:
    paths:
      - '.build-trigger'
      - '.github/workflows/build.yml'
      - 'MDGram/**'
      - 'android/TMessagesProj/src/main/res/**'

permissions:
  contents: write

jobs:
  build:
    name: Сборка APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Код
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Android SDK (лицензии + диагностика)
        run: |
          set -e
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-не задан}"
          echo "ANDROID_HOME=${ANDROID_HOME:-не задан}"
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            SDK=/usr/local/lib/android/sdk
          fi
          echo "SDK=$SDK"
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDK"     >> $GITHUB_ENV
          ls "$SDK" || true
          # автоматически принимаем лицензии — тогда AGP сам докачивает
          # platform/build-tools, которые нужны проекту
          mkdir -p "$SDK/licenses"
          printf '24333f8a63b6825ea9c5514f83c2829b004d1fee\n' > "$SDK/licenses/android-sdk-license"
          printf '84831b9409646a918e30573bab4c9c91346d8abd\n' > "$SDK/licenses/android-sdk-preview-license"
          printf 'd975f751698a77b662f1254ddbeed3901e976f5a\n' > "$SDK/licenses/intel-android-extra-license"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Gradle wrapper
        run: |
          set -e
          cd MDGram
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "wrapper.jar нет в репозитории — генерируем"
            curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-7.6-bin.zip
            unzip -q -o /tmp/gradle.zip -d /opt
            /opt/gradle-7.6/bin/gradle wrapper --gradle-version 7.6 --distribution-type bin --no-daemon
            git add -f gradle/wrapper/gradle-wrapper.jar gradlew gradle/wrapper/gradle-wrapper.properties || true
            git -c user.name="arena-agent" -c user.email="agent@arena.ai" \
                commit -m "gradle-wrapper.jar для сборки в Actions" || true
            git push || true
          fi
          chmod +x gradlew
          ls -la gradle/wrapper/

      - name: Сборка APK
        id: gradle
        continue-on-error: true
        run: |
          set -o pipefail
          cd MDGram
          ./gradlew :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
          echo "=== хвост лога ===" 
          tail -60 /tmp/build.log

      - name: Логи в ветку
        if: always()
        run: |
          mkdir -p build-logs
          cp /tmp/build.log "build-logs/run-${GITHUB_RUN_NUMBER}-$(date +%H%M).log" 2>/dev/null || true
          tail -200 /tmp/build.log > "build-logs/tail-${GITHUB_RUN_NUMBER}.log" 2>/dev/null || true
          git config user.name  "arena-agent"
          git config user.email "agent@arena.ai"
          git add -f build-logs/ || true
          git commit -m "логи сборки ${GITHUB_RUN_NUMBER}" || true
          git pull --rebase || true
          git push || true

      - name: APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mdgram-apk-${{ github.run_number }}
          path: MDGram/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: APK в ветку и в релиз
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p apk
          for f in MDGram/app/build/outputs/apk/release/*.apk; do
            cp "$f" "apk/MDGram-9.3.3.apk"
          done
          ls -la apk/
          git config user.name  "arena-agent"
          git config user.email "agent@arena.ai"
          git add -f apk/MDGram-9.3.3.apk
          git commit -m "APK MDGram 9.3.3 (сборка ${GITHUB_RUN_NUMBER})" || echo "нечего коммитить"
          git pull --rebase || true
          git push || true
          TAG="mdgram-9.3.3-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" apk/MDGram-9.3.3.apk             --title "MDGram 9.3.3 (сборка ${GITHUB_RUN_NUMBER})"             --notes "Автосборка из ветки arena/01a0865a-meowmdmdmmdd" || \
          gh release upload "$TAG" apk/MDGram-9.3.3.apk --clobber || true

  emulator:
    name: Проверка APK в эмуляторе (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Код
        uses: actions/checkout@v4

      - name: APK из сборки
        uses: actions/download-artifact@v4
        with:
          name: mdgram-apk-${{ github.run_number }}
          path: apk

      - name: Включаем KVM
        if: runner.os == 'Linux'
        if: runner.os == 'Linux'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Прогон в эмуляторе (свой запуск, без KVM)
        id: emu
        continue-on-error: true
        run: |
          set +e
          mkdir -p out
          LOG=out/emu.log
          exec > >(tee -a "$LOG") 2>&1
          echo "== SDK =="
          echo "ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME" 2>/dev/null | head
          SDKMAN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMAN" ]; then SDKMAN="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"; fi
          echo "sdkmanager=$SDKMAN"
          yes | "$SDKMAN" --licenses > /dev/null 2>&1
          "$SDKMAN" --install "platform-tools" "platforms;android-30" \
                              "emulator" "system-images;android-30;google_apis;x86_64" 2>&1 | tail -20
          echo "== AVD =="
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
              -n mdtest -k "system-images;android-30;google_apis;x86_64" \
              --device "pixel_2" --force 2>&1 | tail -10
          echo "== старт эмулятора =="
          EXTRA=""
          if [ "$(uname)" != "Darwin" ]; then EXTRA="-no-accel"; fi
          "$ANDROID_HOME/emulator/emulator" -avd mdtest -no-window $EXTRA \
              -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none \
              -partition-size 2048 > out/emulator.log 2>&1 &
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          timeout 240 adb wait-for-device || echo "устройство не появилось за 240 c" 
          echo "устройство подключено: $(adb devices | tail -2)"
          i=0
          while [ "$i" -lt 120 ]; do
            boot=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$boot" = "1" ] && break
            i=$((i+1)); sleep 5
          done
          echo "boot_completed=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r') (попыток: $i)"
          echo "== установка APK =="
          APK=$(ls apk/*.apk | head -1)
          timeout 900 adb install -r "$APK"
          echo "== запуск приложения =="
          adb logcat -c
          adb shell monkey -p org.telegram.mdgram -c android.intent.category.LAUNCHER 1
          sleep 120
          echo "== состояние =="
          adb shell pidof org.telegram.mdgram || echo "ПРОЦЕСС НЕ НАЙДЕН"
          adb shell dumpsys window | grep -E "mCurrentFocus|mFocusedApp" | head -4
          adb shell pm list packages | grep mdgram
          echo "== краши =="
          adb logcat -d | grep -iE "FATAL EXCEPTION|AndroidRuntime|force finishing" | head -30 || echo "крашей нет"
          echo "== хвост logcat =="
          adb logcat -d -t 120
          adb exec-out screencap -p > out/screen.png 2>/dev/null || echo "скриншот не снят"
          ls -la out
          # сохраняем результат в ветку сразу отсюда
          mkdir -p emulator-logs
          cp out/* emulator-logs/ 2>/dev/null || true
          git config user.name  "arena-agent"
          git config user.email "agent@arena.ai"
          git add -f emulator-logs || true
          git commit -m "проверка APK в эмуляторе: логи и скриншот (ран ${GITHUB_RUN_NUMBER})" || echo "нечего коммитить"
          git pull --rebase || true
          git push || true

      - name: Скриншот и логи
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-check-${{ github.run_number }}
          path: out/
          if-no-files-found: warn

      - name: Результаты эмулятора в ветку
        if: always()
        run: |
          mkdir -p emulator-logs
          cp -r out/. emulator-logs/ 2>/dev/null || true
          git config user.name  "arena-agent"
          git config user.email "agent@arena.ai"
          git add -f emulator-logs/ || true
          git commit -m "проверка в эмуляторе: логи и скриншот (ран ${GITHUB_RUN_NUMBER})" || echo "нечего коммитить"
          git pull --rebase || true
          git push || true
