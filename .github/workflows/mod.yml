name: "Мод MDGram 9.3.3 (новое название, без попапа обновления)"

# Дизайн НЕ меняется. Ключи API родные из APK (не трогаем).
# Патчи: 1) название -> "MDGram Revival", 2) URL OTA-проверки -> 127.0.0.1 (тихо),
# 3) About всегда "OFICIAL" как в оригинале (подпись-то теперь наша).

on:
  workflow_dispatch:
  push:
    branches: [arena/01a08582-meowmdmdmmdd]
    paths:
      - .github/workflows/mod.yml
      - .mod-trigger

permissions:
  contents: write

env:
  APKPURE_URL: "https://d.apkpure.net/b/APK/org.telegram.mdgram?versionCode=30275&nc=arm64-v8a%2Carmeabi-v7a%2Cx86%2Cx86_64&sv=21"
  APKPURE_SHA1: "4fa5ae96754b910045d1d84dac7a8261c59793e9"
  NEW_NAME: "MDGram Revival"
  KEYSTORE_PASS: "mdgram-mod-2026"

jobs:
  mod:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout ветки
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Скачивание APK + apktool decode
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p work mod && cd work
          curl -sL --retry 3 -A "Mozilla/5.0" -o MDGram-9.3.3.apk "$APKPURE_URL"
          echo "$APKPURE_SHA1  MDGram-9.3.3.apk" | sha1sum -c -
          # Свежий apktool (в старых сломана пересборка enum в styles.xml)
          APKTOOL_TAG=$(gh release view --repo iBotPeaches/Apktool --json tagName --jq .tagName 2>/dev/null || echo v2.9.3)
          echo "apktool tag: $APKTOOL_TAG"
          curl -sL --retry 3 -o apktool.jar "https://github.com/iBotPeaches/Apktool/releases/download/${APKTOOL_TAG}/apktool_${APKTOOL_TAG#v}.jar" || true
          if ! java -jar apktool.jar --version 2>/dev/null; then
            echo "fallback на v2.9.3"
            curl -sL --retry 3 -o apktool.jar "https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar"
          fi
          java -jar apktool.jar --version
          java -jar apktool.jar d -f -o apktool_out MDGram-9.3.3.apk
          {
            echo "# Мод MDGram 9.3.3 — отчёт сборки ($(date -u +%F\ %T) UTC)"
            echo ""
            echo "- APK: APKPure 9.3.3 (30275), SHA1 сверен: $APKPURE_SHA1"
            echo "- apktool: $APKTOOL_TAG"
            echo "- Название: \`$NEW_NAME\`"
            echo "- Дизайн: не менялся. API-ключи: родные из APK."
          } > ../mod/BUILD_REPORT.md

      - name: Патчи (название, OTA, About)
        run: |
          set -e
          cd work
          cat > patch.py <<'PYEOF'
          import re, pathlib, glob
          root = pathlib.Path("apktool_out")
          rep = []
          # P1: название во всех локалях
          NEW_NAME = "MDGram Revival"
          p1 = 0; p1files = []
          for f in root.rglob("strings.xml"):
              if "/res/values" not in str(f).replace("\\", "/"):
                  continue
              t = f.read_text(encoding="utf-8")
              nt, n = re.subn(r'(<string name="AppName">)[^<]*(</string>)',
                              r'\g<1>' + NEW_NAME + r'\g<2>', t)
              if n:
                  f.write_text(nt, encoding="utf-8")
                  p1 += n; p1files.append(str(f))
          rep.append(f"P1 название AppName='{NEW_NAME}': замен={p1}, файлов={len(p1files)}")
          for x in p1files[:10]:
              rep.append(f"  {x}")
          # P2: URL OTA-проверки -> 127.0.0.1 (кнопка «поделиться» rcmods-apps.xyz/ без слова update — не трогаем)
          needles = re.compile(r'update_mdgram|mdgram\.app|richar1993', re.I)
          hostre = re.compile(r'https?://[^/"\s]+')
          p2 = 0; p2files = []
          for f in root.rglob("*.smali"):
              t = f.read_text(encoding="utf-8", errors="ignore")
              if not needles.search(t):
                  continue
              lines = t.split("\n"); changed = 0
              for i, ln in enumerate(lines):
                  if 'const-string' in ln and needles.search(ln):
                      nl = hostre.sub('https://127.0.0.1', ln)
                      if nl != ln:
                          lines[i] = nl; changed += 1
              if changed:
                  f.write_text("\n".join(lines), encoding="utf-8")
                  p2 += changed; p2files.append(f"{f} ({changed})")
          rep.append(f"P2 OTA URL->127.0.0.1: замен={p2}, файлов={len(p2files)}")
          for x in p2files[:20]:
              rep.append(f"  {x}")
          # P3: Ab.d0() всегда OFICIAL (как в оригинале с родной подписью)
          p3 = "НЕ НАЙДЕН (пропущен, не фатально)"
          for f in root.rglob("Ab.smali"):
              if "mdgram/Activies" not in str(f).replace("\\", "/"):
                  continue
              lines = f.read_text(encoding="utf-8", errors="ignore").split("\n")
              start = next((i for i, ln in enumerate(lines)
                            if ln.startswith(".method") and " d0()V" in ln), None)
              if start is None:
                  continue
              end = next((i for i in range(start, len(lines))
                          if lines[i].startswith(".end method")), len(lines))
              p2idx = next((i for i in range(start, end) if "->p2(" in lines[i]), None)
              if p2idx is None:
                  continue
              mv = next((i for i in range(p2idx, end) if "move-result " in lines[i]), None)
              if mv is None:
                  continue
              reg = lines[mv].split()[-1]
              lines.insert(mv + 1, f"    const/4 {reg}, 0x1")
              f.write_text("\n".join(lines), encoding="utf-8")
              p3 = f"OK ({f}, {reg}=1)"
              break
          rep.append(f"P3 Ab.d0 OFICIAL: {p3}")
          # DIAG: строки styles.xml со значениями 0/1 (подозрение на enum-ошибки aapt2)
          diag = []
          for f in glob.glob("apktool_out/res/values*/styles.xml"):
              for i, ln in enumerate(open(f, encoding="utf-8", errors="ignore"), 1):
                  if re.search(r'>[01]<', ln):
                      diag.append(f"{f}:{i}: {ln.strip()[:220]}")
          rep.append(f"DIAG styles со значениями 0/1: {len(diag)}")
          for x in diag[:40]:
              rep.append(f"  {x}")
          # Информация: все http-строки в smali (для следующей итерации, если наг останется)
          urls = set()
          for f in root.rglob("*.smali"):
              for m in re.finditer(r'const-string[^,]*,\s*"([^"]*https?://[^"]*)"',
                                   f.read_text(encoding="utf-8", errors="ignore")):
                  urls.add(m.group(1)[:150])
          pathlib.Path("../mod/update-url-candidates.txt").write_text(
              "\n".join(sorted(urls)[:100]), encoding="utf-8")
          rep.append(f"INFO: уникальных http-строк в smali: {len(urls)} (список в mod/update-url-candidates.txt)")
          print("\n".join(rep))
          pathlib.Path("../mod/PATCH_REPORT.txt").write_text("\n".join(rep), encoding="utf-8")
          PYEOF
          python3 patch.py | tee ../mod/PATCH_REPORT.txt
          {
            echo ""
            echo "## Патчи"
            cat ../mod/PATCH_REPORT.txt
          } >> ../mod/BUILD_REPORT.md

      - name: Пересборка (apktool b)
        run: |
          set +e
          cd work
          java -jar apktool.jar b -o MDGram-9.3.3-mod-unsigned.apk apktool_out > build.log 2>&1
          echo "exit code: $?" >> build.log
          ls -la >> build.log 2>&1
          if [ -f MDGram-9.3.3-mod-unsigned.apk ]; then
            echo "BUILD_OK=true" >> "$GITHUB_ENV"
            echo "Пересборка: OK ($(stat -c%s MDGram-9.3.3-mod-unsigned.apk) байт)"
          else
            echo "BUILD_OK=false" >> "$GITHUB_ENV"
            echo "Пересборка: ПРОВАЛ"
          fi
          cp build.log ../mod/build.log
          { echo ""; echo "## Пересборка"; tail -30 build.log; } >> ../mod/BUILD_REPORT.md
          exit 0

      - name: Подпись (наш ключ) + проверка
        if: env.BUILD_OK == 'true'
        run: |
          set +e
          {
            echo "=== окружение ==="
            java -version 2>&1
            export ANDROID_HOME="$HOME/android-sdk"
            echo "ANDROID_HOME=$ANDROID_HOME"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            echo "=== cmdline-tools ==="
            curl -sSL --retry 3 -o cmdtools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            echo "curl exit: $?"
            ls -la cmdtools.zip
            unzip -q cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
            echo "unzip exit: $?"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            echo "mv exit: $?"
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
            echo "sdkmanager version exit: $?"
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1
            echo "licenses exit: $?"
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
            echo "sdkmanager install exit: $?"
            BT="$ANDROID_HOME/build-tools/34.0.0"
            ls -la "$BT/zipalign" "$BT/apksigner" "$BT/aapt"
            echo "=== keystore ==="
            cd work
            pwd
            ls -la MDGram-9.3.3-mod-unsigned.apk
            if [ ! -f ../mod-keystore/mdgram.keystore ]; then
              mkdir -p ../mod-keystore
              keytool -genkeypair -keystore ../mod-keystore/mdgram.keystore -alias mdgram-mod \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass "$KEYSTORE_PASS" -keypass "$KEYSTORE_PASS" \
                -dname "CN=MDGram Revival Mod, OU=Personal, O=Personal, C=RU"
              echo "keytool exit: $? (создан новый)"
              KS="создан новый (закоммичен в mod-keystore/)"
            else
              echo "keystore уже есть в репо"
              KS="переиспользован из mod-keystore/"
            fi
            echo "=== zipalign ==="
            "$BT/zipalign" -f 4 MDGram-9.3.3-mod-unsigned.apk MDGram-9.3.3-mod.apk
            echo "zipalign exit: $?"
            ls -la MDGram-9.3.3-mod.apk
            echo "=== apksigner ==="
            "$BT/apksigner" sign --verbose --ks ../mod-keystore/mdgram.keystore \
              --ks-pass:pass:"$KEYSTORE_PASS" --key-pass:pass:"$KEYSTORE_PASS" MDGram-9.3.3-mod.apk
            echo "apksigner exit: $?"
            if [ -f MDGram-9.3.3-mod.apk ]; then
              {
                echo ""
                echo "## Подпись"
                echo "- Ключ: $KS"
                echo "- apksigner verify:"
                "$BT/apksigner" verify --print-certs MDGram-9.3.3-mod.apk 2>&1 | head -8
                echo ""
                echo "## Проверка названия и пакета"
                "$BT/aapt" dump badging MDGram-9.3.3-mod.apk 2>/dev/null | grep -E "^package|application-label" | head -5
                echo ""
                echo "## Установка"
                echo "- Сначала УДАЛИ оригинальный MDGram (подпись другая — поверх не встанет)."
                echo "- Потом ставь MDGram-9.3.3-mod.apk из релиза mod-9.3.3."
              } >> ../mod/BUILD_REPORT.md
            fi
          } > ../mod/sign.log 2>&1
          tail -20 ../mod/sign.log || true
          if grep -q "apksigner exit: 0" ../mod/sign.log && [ -f "$GITHUB_WORKSPACE/work/MDGram-9.3.3-mod.apk" ]; then
            echo "SIGN_OK=true" >> "$GITHUB_ENV"
            echo "SIGN_OK=true"
          else
            echo "SIGN_OK=false" >> "$GITHUB_ENV"
            echo "SIGN_OK=false"
          fi
          exit 0

      - name: Коммит отчёта и ключа в ветку
        if: always()
        run: |
          set -e
          git config user.name "arena-decompile-bot"
          git config user.email "arena-decompile-bot@users.noreply.github.com"
          git add mod || true
          if [ -d mod-keystore ]; then git add mod-keystore || true; fi
          git status --short || true
          if git diff --cached --quiet; then
            echo "Изменений нет"
          else
            git commit -m "Мод MDGram 9.3.3: отчёт сборки (BUILD_OK=${BUILD_OK:-unset} SIGN_OK=${SIGN_OK:-unset}, $(date -u +%F))"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Артефакт с модом
        if: env.BUILD_OK == 'true' && env.SIGN_OK == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mdgram-933-mod
          path: work/MDGram-9.3.3-mod.apk
          retention-days: 90

      - name: Релиз mod-9.3.3 с APK
        if: env.BUILD_OK == 'true' && env.SIGN_OK == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd work
          if gh release view mod-9.3.3 >/dev/null 2>&1; then
            gh release upload mod-9.3.3 MDGram-9.3.3-mod.apk --clobber
          else
            gh release create mod-9.3.3 MDGram-9.3.3-mod.apk \
              --title "MDGram 9.3.3 МОД (новое название, без попапа обновления)" \
              --notes "Мод MDGram 9.3.3: название MDGram Revival, OTA-попап обновления отключён, дизайн и API-ключи без изменений. ВАЖНО: сначала удали оригинальный MDGram (подпись другая)."
          fi

      - name: Статус сборки
        if: always()
        run: |
          if [ "${BUILD_OK:-false}" = "true" ] && [ "${SIGN_OK:-false}" = "true" ]; then
            echo "СБОРКА УСПЕШНА"
          else
            echo "СБОРКА ПРОВАЛЕНА (BUILD_OK=${BUILD_OK:-unset} SIGN_OK=${SIGN_OK:-unset}) — смотри mod/"
            exit 1
          fi
