plugins {
    id 'com.android.application'
}

// MDGram Revival: движок Telegram 9.3.3 + МД-слой. Нативка — готовые .so (без NDK).

android {
    namespace 'org.telegram.mdgram'
    compileSdk 33

    defaultConfig {
        applicationId 'org.telegram.mdgram'
        minSdk 21
        targetSdk 33
        versionCode 30275
        versionName '9.3.3'
        multiDexEnabled true
        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        release {
            storeFile file('../../mod-keystore/mdgram.keystore')
            storePassword System.getenv('KEYSTORE_PASS') ?: 'mdgram-mod-2026'
            keyAlias 'mdgram-mod'
            keyPassword System.getenv('KEYSTORE_PASS') ?: 'mdgram-mod-2026'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            debuggable false
        }
        debug {
            applicationIdSuffix '.debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    sourceSets {
        main {
            java.srcDirs = ['src/main/java']
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    lintOptions {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core:1.6.0'
    implementation 'androidx.palette:palette:1.0.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.3'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.sharetarget:sharetarget:1.2.0'

    compileOnly 'org.checkerframework:checker-qual:2.5.2'
    compileOnly 'org.checkerframework:checker-compat-qual:2.5.0'
    implementation 'com.google.firebase:firebase-messaging:22.0.0'
    implementation 'com.google.firebase:firebase-config:21.0.1'
    implementation 'com.google.firebase:firebase-datatransport:18.1.0'
    implementation 'com.google.firebase:firebase-appindexing:20.0.0'
    implementation 'com.google.android.gms:play-services-maps:18.1.0'
    implementation 'com.google.android.gms:play-services-auth:20.4.0'
    implementation 'com.google.android.gms:play-services-vision:20.1.3'
    implementation 'com.google.android.gms:play-services-wearable:18.0.0'
    implementation 'com.google.android.gms:play-services-location:21.0.1'
    implementation 'com.google.android.gms:play-services-wallet:19.1.0'
    implementation 'com.googlecode.mp4parser:isoparser:1.0.6'
    implementation 'com.stripe:stripe-android:2.0.2'
    implementation 'com.google.mlkit:language-id:16.1.1'
    implementation 'com.android.billingclient:billing:5.1.0'
    implementation 'com.google.code.gson:gson:2.10'
    implementation files('libs/libgsaverification-client.aar')

    // === MDGram: библиотеки, которые использует МД-слой (из декомпила) ===
    // TODO: координаты/версии проверять при первой сборке
    implementation 'androidx.appcompat:appcompat:1.6.1'                    // Toolbar
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.9.0'            // BottomSheetBehavior
    // com.ruffian.library:RWidgetHelper:1.0.2 больше нет ни в одном репозитории —
    // виджеты R* при необходимости переносятся в исходники проекта (см. Views/)
    implementation 'com.blankj:utilcodex:1.31.1'                           // SizeUtils/KeyboardUtils/...
    implementation 'io.github.cymchad:BaseRecyclerViewAdapterHelper:3.0.11' // BaseQuickAdapter
    implementation 'com.github.H07000223:FlycoTabLayout:2.1.2'             // SegmentTabLayout
    implementation 'com.jakewharton.processphoenix:process-phoenix:2.1.2'  // смена иконки/перезапуск
    implementation 'org.greenrobot:eventbus:3.3.1'
    implementation 'cat.ereza:customactivityoncrash:2.4.0'
    implementation 'com.github.moxy-community:Moxy:2.2.2'
    implementation 'com.github.moxy-community:Moxy-AndroidX:2.2.2'
    // проект без Kotlin-плагина, поэтому кодогенератор цепляем как annotationProcessor
    annotationProcessor 'com.github.moxy-community:Moxy-Compiler:2.2.2'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:1.1.5'
}
